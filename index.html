:root{--bg:#faf9f7;--surface:#fff;--surface2:#f5f2ed;--text:#1c1917;--muted:#78716c;--line:#e9e5df;--brand:#8c5a1e;--brand2:#8c5a1e;--brandSoft:#f3ede4;--shadow:none;--radius:16px;--serif:'Newsreader',Georgia,'Times New Roman',serif}
html.dark{--bg:#14110f;--surface:#1c1917;--surface2:#221e1b;--text:#f3efe9;--muted:#a39b92;--line:#2f2a26;--brand:#d4a15e;--brand2:#d4a15e;--brandSoft:#2a221a;--shadow:none}
html{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brandtitle,.recipe-title,.detail-title{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line);padding:12px 18px}
.brandmark{width:34px;height:34px;border-radius:0;background:none;box-shadow:none}.brandmark svg{width:34px;height:34px;display:block}
.brandtitle{font-size:21px;line-height:1}.brandsub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}
.icon-btn{border-color:var(--line);background:transparent;color:var(--text);border-radius:12px}.icon-btn:hover{background:var(--surface2);border-color:var(--line)}.icon-btn svg{stroke-width:1.5}
.card{border-radius:var(--radius);box-shadow:none}
.hero-main{background:var(--surface);min-height:0;padding:26px 24px}.hero h2{font-size:clamp(28px,4.6vw,40px);line-height:1.1;font-weight:500}.hero p{font-size:15px;font-weight:300}
.eyebrow,.smallcaps{text-transform:none;letter-spacing:.01em;font-size:12px;font-weight:500;color:var(--muted)}
.section-head h2{font-size:22px}.section-head p{font-weight:300}
.chip{font-weight:500;font-size:12px;background:transparent}.chip.active{color:var(--text);background:var(--surface2);border-color:var(--text)}
.metric b{font-family:var(--serif);font-weight:500;font-size:22px}.metric span{font-weight:300}
.btn{background:var(--text);color:var(--bg);box-shadow:none;font-weight:500;border-radius:12px;font-size:14px}.btn:hover{filter:none;opacity:.88}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.soft{background:var(--surface2);color:var(--text)}.btn.danger{background:transparent;color:#a3412a;border:1px solid var(--line)}.btn.sm{font-size:12.5px}
.btn svg{stroke-width:1.5}

let state=loadState();let activeTab='home';let search='';let deferredInstall=null;let speaking=false;let currentRecipeId=null;let busy=false;
function loadState(){try{const raw=localStorage.getItem(APP_KEY);if(raw){const x=JSON.parse(raw);return {...DEFAULT_STATE,...x,settings:{...DEFAULT_STATE.settings,...(x.settings||{})},recipes:(Array.isArray(x.recipes)?x.recipes:[]).map(r=>{const n=SAMPLE.find(z=>z.id===r.id);return n&&!r.v?{...n,createdAt:r.createdAt||n.createdAt}:r})};}}catch(e){}return {...DEFAULT_STATE,recipes:SAMPLE.map(x=>({...x}))};}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state));}catch(e){toast('Shranjevanje v brskalnik ni uspelo.');}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}

function isFav(id){return state.favorites.includes(id)}

function dish(r){const t=((r.title||'')+' '+(r.subtitle||'')).toLowerCase();const m=r.emoji&&[...r.emoji].length<=3?r.emoji:null;return m||(KW.find(k=>k[0].test(t))||[0,CATE[(r.category||'').toLowerCase()]||'🍽️'])[1]}
function hueOf(r){const b={zajtrk:42,malica:28,kosilo:88,večerja:128,sladica:335,prigrizek:20}[(r.category||'').toLowerCase()]??95;return b+[...(r.title||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%26-8}
function recipeEmoji(r){return `<b class="dish" style="--h:${hueOf(r)}"><i class="d1">${dish(r)}</i></b>`}

function customApps(){return (state.settings.customAppliances||[]).map(c=>[c.id,c.label,''])}
function allAppliances(){const h=state.settings.hiddenAppliances||[];return [...APPLIANCES.filter(a=>!h.includes(a[0])),...customApps()]}

return `<section class="hero"><div class="card hero-main"><div class="eyebrow">${n?esc(g)+', '+esc(n):esc(g)}</div><h2>Kaj bomo danes skuhali?</h2><p>Povej željo in Gemini sestavi recept, ki ustreza tvoji kuhinji. Sestavine pa z enim tapom končajo na nakupovalnem seznamu.</p><div class="chips"><button class="chip active" data-action="generate">${icon('spark',16)} Ustvari recept</button><button class="chip" data-action="tab" data-tab="list">${icon('cart',15)} Nakupovalni seznam${open?` · ${open}`:''}</button></div></div></section><div class="section-head"><div><h2>Hitri predlogi</h2></div></div><div class="qrow">${Q.map(q=>`<button class="qcard" data-action="quick" data-wish="${esc(q[2])}"><span>${q[0]}</span>${q[1]}</button>`).join('')}</div><div class="section-head"><div><h2>Zadnji recepti</h2><p>Nadaljuj tam, kjer si končal.</p></div><button class="btn ghost sm" data-action="saved">Prikaži vse</button></div>${renderRecipeGrid(state.recipes.slice(0,4))}`}

function renderSaved(onlyFav){let list=state.recipes.filter(r=>!onlyFav||isFav(r.id));if(search.trim()){const q=search.toLowerCase();list=list.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}return `<div class="section-head"><div><div class="eyebrow">${onlyFav?'Shranjeni priljubljeni':'Moja zbirka'}</div><h2>${onlyFav?'Priljubljeni recepti':'Vsi recepti'}</h2><p>${onlyFav?'Recepti, do katerih se rad vrneš.':'Išči, urejaj, deli in prilagajaj.'}</p></div><div style="display:flex;gap:6px"><button class="btn ghost sm" data-action="newRecipe">${icon('edit',14)} Ročno</button><button class="btn sm ai-generate-btn" data-action="generate" title="Ustvari recept z AI" aria-label="Ustvari recept z AI">${icon('spark',14)} <span>Z AI</span></button></div></div><div class="searchbar"><div class="search-wrap">${icon('search',18)}<input class="input" value="${esc(search)}" placeholder="Išči po naslovu, sestavini ali aparatu …" data-search></div><button class="icon-btn" data-action="clearSearch">${icon('close',18)}</button></div><div style="height:10px"></div>${renderRecipeGrid(list)}`}
function timeButtons(){return `<div class="range">${TIMES.map(([v,l])=>`<button type="button" class="btn soft sm time-opt${String(state.settings.time||'45')===v?' active':''}" data-time="${v}">${l}</button>`).join('')}</div>`}
function renderGenerate(){return `<section class="card" style="padding:18px"><div class="eyebrow">AI kuhinjski kopilot</div><h2 style="margin:0 0 7px;font-size:27px">Kaj danes kuhamo?</h2><p style="margin:0;color:var(--muted);font-size:13px;line-height:1.5">Povej jed ali samo situacijo. Naj AI upošteva tvoja pravila in naprave.</p><div class="field"><label>Želja</label><div style="display:flex;gap:8px"><textarea id="gWish" class="textarea" rows="3" placeholder="npr. želim sočnega piščanca, brez svinjine, nekaj za jutri"></textarea><button class="icon-btn" data-action="mic" data-target="gWish" aria-label="Govori">${icon('mic',20)}</button></div></div><div class="two"><div class="field"><label>Obrok</label><select id="gMeal" class="select">${MEALS.map(m=>`<option>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></div><div class="field"><label>Za koliko oseb</label><select id="gPeople" class="select">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===+state.settings.people?'selected':''}>${n} ${peopleLabel(n)}</option>`).join('')}</select></div></div><div class="field"><label>Koliko časa imaš?</label>${timeButtons()}</div><div class="toggle-row"><div><strong>Za naslednji dan (priprava vnaprej)</strong><div class="help">AI bo količino in shranjevanje zasnoval tako, da je naslednji dan še uporabno.</div></div><button class="toggle" id="gLeft" data-on="false"><i></i></button></div><div class="field"><label>Aparati, ki so na voljo</label><div class="checks">${allAppliances().map(a=>`<label class="check"><input type="checkbox" value="${a[0]}" ${state.settings.appliances.includes(a[0])?'checked':''} data-gapp><span>${esc(a[1])}</span></label>`).join('')}</div></div><div class="field"><label>Prehranske omejitve / želje</label><input id="gDiet" class="input" value="${esc(state.settings.diet)}" placeholder="npr. brez laktoze, visoko beljakovinsko"></div><div class="field"><label>Sestavine, ki jih imaš doma</label><div style="display:flex;gap:8px"><textarea id="gHave" class="textarea" rows="2" placeholder="npr. piščanec, krompir, bučke, smetana …"></textarea><button class="icon-btn" data-action="mic" data-target="gHave">${icon('mic',20)}</button></div></div><div class="field"><label>Sestavine, ki jih nočeš / nimaš</label><input id="gAvoid" class="input" placeholder="npr. nimam jajc; ne maram koriandra"></div><div class="split-actions"><button class="btn" data-action="generateAI" ${busy?'disabled':''}>${busy?'<span class="loading"><span class="dotspin"></span> Generiram …</span>':`${icon('spark',16)} Generiraj recept`}</button><button class="btn ghost" data-action="settings">${icon('settings',16)} Nastavitve</button></div></section>`}
function openSheet(html){const s=document.getElementById('sheet');document.getElementById('sheetContent').innerHTML=html;s.classList.remove('hidden');document.body.style.overflow='hidden'}function closeSheet(){if(collectSettings())save();document.getElementById('sheet').classList.add('hidden');document.getElementById('sheetContent').innerHTML='';document.body.style.overflow=''}
function recipeDetail(r){const total=(+r.prepMinutes||0)+(+r.cookMinutes||0);const appList=(r.appliances||[]).map(applianceLabel);const ingredients=r.ingredients||[];const steps=r.steps||[];const prepAhead=r.prepAhead||[];const tips=r.tips||[];const storage=r.storage||[];return `<div class="sheet-head"><div><div class="smallcaps">${esc(r.category||'Recept')}</div><h2>${esc(r.title)}</h2></div><button class="close" data-action="close" aria-label="Zapri">${icon('close',18)}</button></div><div class="detail-hero"><div class="dhero" style="--h:${hueOf(r)}"><i class="d1">${dish(r)}</i></div><div class="detail-kicker"><span class="pill">${icon('clock',12)} ${total} min</span><span class="pill">${icon('users',12)} ${peopleText(r.servings||2)}</span><span class="pill">${esc(r.difficulty||'')}</span>${r.leftoversNextDay?'<span class="pill">Za jutri</span>':''}</div><h1 class="detail-title">${esc(r.title)}</h1><p style="margin:0;color:var(--muted);line-height:1.5">${esc(r.subtitle||'')}</p><div class="detail-actions"><button class="btn" data-action="fav" data-id="${esc(r.id)}">${heart(isFav(r.id),16)} ${isFav(r.id)?'Odstrani priljubljene':'Dodaj med priljubljene'}</button><button class="btn ghost" data-action="addList" data-id="${esc(r.id)}" title="Na nakupovalni seznam" aria-label="Na nakupovalni seznam">${icon('cart',16)} <span class="action-label">Na nakupovalni seznam</span></button><button class="btn ghost" data-action="edit" data-id="${esc(r.id)}" title="Uredi recept" aria-label="Uredi recept">${icon('edit',16)} <span class="action-label">Uredi</span></button><button class="btn ghost" data-action="aiEdit" data-id="${esc(r.id)}" title="Popravi z AI" aria-label="Popravi z AI">${icon('spark',16)} <span class="action-label">Popravi z AI</span></button><button class="btn ghost" data-action="share" data-id="${esc(r.id)}" title="Deli recept" aria-label="Deli recept">${icon('share',16)} <span class="action-label">Deli</span></button></div></div><div class="detail-grid"><div class="detail-box"><h3>${icon('basket',17)} Sestavine</h3>${ingredients.map(x=>`<div class="ingredient"><span>${esc(ingredientEmoji(x))} ${esc(x.name)}</span><strong>${esc(x.qty)}</strong></div>`).join('')}</div><div class="detail-box"><h3>${icon('flame',17)} Priprava</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${appList.map(a=>`<span class="chip active">${esc(a)}</span>`).join('')}</div><p class="help" style="margin-top:12px">Skupaj: ${+r.prepMinutes||0} min priprave + ${+r.cookMinutes||0} min kuhanja/pečenja.</p>${(r.equipment||[]).length?`<div class="detail-note"><strong>Potrebna oprema:</strong> ${esc(r.equipment.join(', '))}</div>`:''}</div></div>${prepAhead.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('clock',17)} Priprava vnaprej</h3><div class="detail-list">${prepAhead.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}<div class="detail-box" style="margin-top:12px"><h3>${icon('chef',17)} Natančni koraki</h3>${steps.map((st,i)=>`<div class="step"><div class="stepnum">${i+1}</div><div style="font-size:13px;line-height:1.6">${esc(st)}</div></div>`).join('')}</div>${r.leftoversNextDay&&r.nextDayPlan?`<div class="detail-box" style="margin-top:12px"><h3>${icon('calendar',17)} Za naslednji dan</h3><div class="detail-note">${esc(r.nextDayPlan)}</div></div>`:''}${storage.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('box',17)} Shranjevanje</h3><div class="detail-list">${storage.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}${tips.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('spark',17)} Nasveti</h3><div class="detail-list">${tips.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}${(r.substitutions||[]).length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('swap',17)} Predlogi zamenjav</h3>${r.substitutions.map(s=>`<div class="ingredient"><span>${esc(s.from)} → ${esc(s.to)}</span><span style="color:var(--muted);max-width:45%;text-align:right">${esc(s.note||'')}</span></div>`).join('')}</div>`:''}${(r.shopping||[]).length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('cart',17)} Nakupovalni seznam</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${r.shopping.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`:''}`}
function showRecipe(id){const r=getRecipe(id);if(!r)return;currentRecipeId=id;openSheet(recipeDetail(r))}
function editForm(r,isNew){return `<div class="sheet-head"><div><div class="smallcaps">${isNew?'Ročni vnos':'Urejanje'}</div><h2>${isNew?'Dodaj svoj recept':'Uredi recept'}</h2></div><button class="close" data-action="close">${icon('close',18)}</button></div><div class="field"><label>Naslov</label><input id="eTitle" class="input" value="${esc(r.title)}"></div><div class="field"><label>Podnaslov</label><input id="eSubtitle" class="input" value="${esc(r.subtitle||'')}"></div><div class="two"><div class="field"><label>Obrok / kategorija</label><input id="eCategory" class="input" list="mealList" value="${esc(r.category||'')}"><datalist id="mealList">${MEALS.map(m=>`<option value="${m[0].toUpperCase()+m.slice(1)}">`).join('')}</datalist></div><div class="field"><label>Oseb</label><input id="eServings" class="input" type="number" min="1" max="20" value="${+r.servings||2}"></div></div><div class="two"><div class="field"><label>Priprava (min)</label><input id="ePrep" class="input" type="number" min="0" value="${+r.prepMinutes||0}"></div><div class="field"><label>Kuhanje / pečenje (min)</label><input id="eCook" class="input" type="number" min="0" value="${+r.cookMinutes||0}"></div></div><div class="field"><label>Aparati</label><div class="checks">${allAppliances().map(a=>`<label class="check"><input type="checkbox" value="${a[0]}" ${(r.appliances||[]).includes(a[0])?'checked':''} data-eapp><span>${esc(a[1])}</span></label>`).join('')}</div></div><div class="field"><label>Sestavine – ena na vrstico, količina — sestavina</label><textarea id="eIngredients" class="textarea" rows="9" placeholder="400 g — piščančja stegna&#10;2 žlici — olivno olje&#10;sol">${esc((r.ingredients||[]).map(x=>`${x.qty} — ${x.name}`).join('\n'))}</textarea></div><div class="field"><label>Koraki – čim bolj natančno, eden na vrstico</label><textarea id="eSteps" class="textarea" rows="11" placeholder="Pečico segrej na 200 °C.&#10;Meso posoli in ga peci 25 minut, da je zlato rjavo.">${esc((r.steps||[]).join('\n'))}</textarea><small>Pri ročnem urejanju lahko dopišeš temperaturo, moč kuhalne plošče, čas, količino, velikost posode in znak pečenosti.</small></div><div class="field"><label>Priprava vnaprej – eden na vrstico</label><textarea id="ePrepAhead" class="textarea" rows="4">${esc((r.prepAhead||[]).join('\n'))}</textarea></div><div class="field"><label>Nasveti – eden na vrstico</label><textarea id="eTips" class="textarea" rows="5">${esc((r.tips||[]).join('\n'))}</textarea></div><div class="field"><label>Shranjevanje – eden na vrstico</label><textarea id="eStorage" class="textarea" rows="4">${esc((r.storage||[]).join('\n'))}</textarea></div><div class="field"><label>Navodilo za naslednji dan</label><textarea id="eNextDay" class="textarea" rows="3">${esc(r.nextDayPlan||'')}</textarea></div><div class="split-actions"><button class="btn" data-action="saveEdit" data-id="${esc(r.id)}">${icon('check',16)} Shrani spremembe</button><button class="btn ghost" data-action="close">Prekliči</button>${isNew?'':`<button class="btn danger" data-action="deleteRecipe" data-id="${esc(r.id)}">${icon('trash',16)} Izbriši</button>`}</div>`}
function openEditor(id){const r=getRecipe(id);if(r)openSheet(editForm(r))}
function parseIngredientsText(text){return text.split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split(/\s*[—–]\s*|\s+-\s+/);if(parts.length>1)return {qty:parts[0].trim(),name:parts.slice(1).join('—').trim(),section:'Glavno'};return {name:line,qty:'po potrebi',section:'Glavno'}})}
function saveEdit(id){let r=getRecipe(id);let isNew=false;if(!r&&draftRecipe&&draftRecipe.id===id){r=draftRecipe;isNew=true}if(!r)return;if(isNew&&!document.getElementById('eTitle').value.trim()){toast('Vpiši naslov recepta.');return}r.title=document.getElementById('eTitle').value.trim()||r.title;r.subtitle=document.getElementById('eSubtitle').value.trim();r.category=document.getElementById('eCategory').value.trim()||r.category;r.servings=Math.max(1,+document.getElementById('eServings').value||2);r.prepMinutes=Math.max(0,+document.getElementById('ePrep').value||0);r.cookMinutes=Math.max(0,+document.getElementById('eCook').value||0);r.ingredients=parseIngredientsText(document.getElementById('eIngredients').value);r.steps=document.getElementById('eSteps').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);r.prepAhead=(document.getElementById('ePrepAhead')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);r.tips=document.getElementById('eTips').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);r.storage=(document.getElementById('eStorage')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);r.nextDayPlan=(document.getElementById('eNextDay')?.value||'').trim();{const known=allAppliances().map(a=>a[0]);r.appliances=[...(r.appliances||[]).filter(x=>!known.includes(x)),...[...document.querySelectorAll('[data-eapp]:checked')].map(x=>x.value)]}if(isNew){state.recipes.unshift(r);draftRecipe=null}save();closeSheet();render();showRecipe(id);toast(isNew?'Recept dodan.':'Recept posodobljen.')}
function aiEditForm(r){return `<div class="sheet-head"><div><div class="smallcaps">AI prilagoditev</div><h2>Kako naj recept spremenim?</h2></div><button class="close" data-action="close">${icon('close',18)}</button></div><p style="color:var(--muted);line-height:1.45;font-size:13px">Lahko napišeš ali poveš navodilo. AI bo ohranil bistvo jedi in prilagodil sestavine, korake ter čas po tvoji zahtevi.</p><div class="field"><label>Navodilo</label><div style="display:flex;gap:8px"><textarea id="aiInstruction" class="textarea" rows="5" placeholder="npr. nimam jajc, prosim uporabi drugo vezivo; naredi za 5 oseb; uporabi samo airfryer; manj pekoče"></textarea><button class="icon-btn" data-action="mic" data-target="aiInstruction">${icon('mic',20)}</button></div></div><div class="split-actions"><button class="btn" data-action="runAiEdit" data-id="${esc(r.id)}">${icon('spark',16)} Prilagodi recept</button><button class="btn ghost" data-action="close">Prekliči</button></div><div class="status" style="margin-top:10px">Upoštevani bodo tudi tvoji aparati in prehranske nastavitve.</div>`}
function openAiEdit(id){const r=getRecipe(id);if(r)openSheet(aiEditForm(r))}
function shareText(r){return `${r.title}\n${r.subtitle||''}\n\nZa ${peopleText(r.servings)} · ${(+r.prepMinutes||0)+(+r.cookMinutes||0)} min\n\nSestavine:\n${(r.ingredients||[]).map(x=>`• ${x.qty} ${x.name}`).join('\n')}\n\nPriprava:\n${(r.steps||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')}`}
async function shareRecipe(r){const text=shareText(r);if(navigator.share){try{await navigator.share({title:r.title,text});toast('Recept je pripravljen za deljenje.');return}catch(e){if(e?.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Recept kopiran v odložišče.')}catch(e){openSheet(`<div class="sheet-head"><h2>Deli recept</h2><button class="close" data-action="close">${icon('close',18)}</button></div><div class="share-preview">${esc(text)}</div><div class="split-actions"><button class="btn" data-action="close">Zapri</button></div>`)}}
function importSharedFromHash(){try{const h=location.hash;if(!h.startsWith('#recipe='))return;const json=decodeURIComponent(escape(atob(h.slice(8))));const r=JSON.parse(json);r.id=uid();state.recipes.unshift(r);save();history.replaceState(null,'',location.pathname+location.search);showRecipe(r.id)}catch(e){}}
function encodeRecipe(r){const s=JSON.stringify(r);return btoa(unescape(encodeURIComponent(s)))}
function buildShareUrl(r){return `${location.origin}${location.pathname}#recipe=${encodeURIComponent(encodeRecipe(r))}`}
async function copyLink(r){try{await navigator.clipboard.writeText(buildShareUrl(r));toast('Povezava do recepta je kopirana.')}catch(e){toast('Povezave ni bilo mogoče kopirati.')}}
async function runAiEdit(id){const r=getRecipe(id);const instruction=(document.getElementById('aiInstruction')?.value||'').trim();if(!instruction){toast('Napiši, kaj želiš spremeniti.');return}busy=true;openSheet(`<div class="sheet-head"><h2>Prilagajam recept …</h2><button class="close" data-action="close">${icon('close',18)}</button></div><div class="loading"><span class="dotspin"></span> Gemini pripravlja prilagoditev.</div>`);try{const prompt=buildAdaptPrompt(r,instruction);const out=await callGemini(prompt);const merged=normalizeRecipe(out,r.servings);merged.id=r.id;merged.createdAt=r.createdAt||Date.now();state.recipes=state.recipes.map(x=>x.id===id?merged:x);save();closeSheet();render();showRecipe(id);toast('Recept je prilagojen z AI.')}catch(e){toast(e.message||'AI prilagoditev ni uspela.');openAiEdit(id)}finally{busy=false}}
function buildGeneratePrompt(form){const apps=form.apps.map(applianceLabel);return `Ustvari en sam res izvedljiv, zelo podroben domači recept v slovenščini. Recept mora biti napisan tako, da ga lahko uporabnik pripravi brez dodatnih vprašanj. Upoštevaj vse spodnje pogoje in ne uporabljaj aparata, ki ni na voljo.

UPORABNIKOVA ŽELJA: "${form.wish||'nekaj okusnega'}"
OBROK: ${form.meal}
ŠTEVILO OSEB: ${form.people} (${peopleLabel(form.people)})
ČASOVNA OMEJITEV: ${form.timeLabel}
ZA NASLEDNJI DAN (PRIPRAVA VNAPREJ): ${form.leftovers?'DA':'NE'}
RAZPOLOŽLJIVI APARATI: ${apps.join(', ')||'ni določeno'}
PREHRANSKE ŽELJE/OMEJITVE: ${form.diet||'brez posebnosti'}
SESTAVINE, KI SO DOMA: ${form.have||'ni navedeno'}
SESTAVINE/REČI, KI JIH NI ALI SE JIM ŽELI IZOGNITI: ${form.avoid||'nič posebnega'}

OBVEZNA PRAVILA ZA KAKOVOST: \n0. Polje emoji pri receptu = en emoji, ki najbolj ustreza jedi. Pri vsaki sestavini izpolni emoji (en emoji) in aisle, ki je natanko ena od: Sadje in zelenjava, Meso in ribe, Mlečni izdelki, Kruh in testenine, Shramba in začimbe, Drugo.
1. Za ${peopleText(form.people)} navedi konkretne količine za vsako bistveno sestavino, z uporabnimi enotami (g, ml, kos, žlička, žlica).
2. Recept mora imeti jasen seznam opreme in natančen postopek.
3. Vsak korak napiši zelo konkretno: kaj narediš, s katero količino, v kateri posodi/položaju, na kateri temperaturi ali moči, koliko časa ter kako veš, da je korak zaključen.
4. Pri pečenju, airfryerju in pizza peči vedno navedi temperaturo v °C, način/ventilacijo, predgretje in okviren čas; upoštevaj, da se aparati razlikujejo.
5. Pri indukciji navedi smiselno stopnjo moči ali opis toplote (npr. srednja moč), pri mesu pa po potrebi dodaj znak pečenosti in priporočeno notranjo temperaturo.
6. Ne izmišljaj posebnih tehnik ali opreme. Domača oprema naj bo dovolj.
7. Če so podane sestavine doma, jih smiselno porabi. Če kakšna ni na voljo, predlagaj kulinarično smiselno zamenjavo in jo dejansko uporabi v receptu.
8. SESTAVINE DOMA imajo prednost in jih smiselno uporabi. Česar uporabnik izrecno nima ali noče, ne uporabi niti kot skrite sestavine v omaki ali mešanici.
9. IZOGIBANJE JE TRDNA OMEJITEV: polje "Sestavine/reci, ki jih ni ali se jim želi izogniti" pomeni prepoved. Upoštevaj tudi očitne sinonime in sestavine, ki jih vsebujejo omake ali mešanice.
10. PREHRANSKE OMEJITVE so trdne za celoten recept. Npr. vegetarijansko/vegansko, brez svinjine, brez govedine, brez glutena in brez laktoze ne smejo biti kršene niti z dodatki, omakami ali zamenjavami.
11. APARATI: uporabljaj samo aparate, navedene kot razpoložljive. Ne zahtevaj posebnega aparata, če ni naveden; osnovno ročno kuhinjsko orodje je dovoljeno.
12. ČAS: skupni čas priprave + kuhanja naj bo znotraj izbrane omejitve. Če je vključena priprava za naslednji dan, loči pripravo danes od ponovne priprave jutri.
13. Če je vklopljena priprava za naslednji dan, recept prilagodi tako, da je naslednji dan kakovostno uporaben; dodaj natančno ohlajanje, shranjevanje in ponovno segrevanje.
14. Dodaj uporabne nasvete, pripravo vnaprej, shranjevanje ter morebitne zamenjave. Zamenjava ne sme kršiti nobene uporabnikove omejitve.
15. Ne uporabljaj nejasnih navodil kot so "speci do konca" brez dodatnega znaka pečenosti, časa ali temperature.
16. Piši živo in apetitno; podnaslov (subtitle) naj opiše okus, teksturo in vonj jedi.
17. Korake piši v celih stavkih, razloži kratek razlog in kako prepoznaš, da je korak uspel. Vsak recept naj ima vsaj 5 korakov.
18. Pred vrnitvijo naredi notranji kontrolni pregled: nobena prepovedana sestavina ni prisotna, uporabljeni so samo dovoljeni aparati, količine ustrezajo številu oseb, čas ustreza omejitvi, domače sestavine so smiselno uporabljene ter vsaka sestavina ima emoji in veljaven aisle.
19. Vrni samo veljaven JSON po zahtevani shemi.`}

const cloud={fb:null,user:null,ready:false,failed:'',status:'',unsub:null,timer:null,applying:false,device:(()=>{try{let d=localStorage.getItem('recepti-ai.device');if(!d){d='d-'+Math.random().toString(36).slice(2,10);localStorage.setItem('recepti-ai.device',d)}return d}catch(e){return 'd-x'}})()};

async function cloudStart(){const{fs,db}=cloud.fb;const ref=fs.doc(db,'users',cloud.user.uid);cloud.ready=false;cloudSetStatus('Sinhroniziram …');
 try{const snap=await fs.getDoc(ref);const last=+lsGet(syncKey())||0;const dirty=lsGet('recepti-ai.dirty')==='1';
  if(!snap.exists()){cloud.ready=true;await cloudPush()}
  else{const d=snap.data();const remote=JSON.parse(d.data||'{}');
   if(!last||(dirty&&d.updatedAt>last)){cloudApply(cloudMerge(remote));cloud.ready=true;await cloudPush();toast('Podatki so združeni z Google računom.')}
   else if(d.updatedAt>last&&d.device!==cloud.device){cloudApply(remote);lsSet(syncKey(),String(d.updatedAt));lsSet('recepti-ai.dirty','0');cloud.ready=true;cloudSetStatus('Sinhronizirano ob '+cloudStamp())}
   else{cloud.ready=true;if(dirty)await cloudPush();else cloudSetStatus('Sinhronizirano ob '+cloudStamp())}}
 }catch(e){cloud.ready=false;cloudSetStatus(cloudErr(e));return}

  if(cloud.timer||lsGet('recepti-ai.dirty')==='1'){cloudApply(cloudMerge(remote));lsSet(syncKey(),String(d.updatedAt));cloudSchedule()}else{cloudApply(remote);lsSet(syncKey(),String(d.updatedAt))}
  cloudSetStatus('Sinhronizirano ob '+cloudStamp())},err=>cloudSetStatus(cloudErr(err)))}

async function cloudSignOut(){if(!cloud.fb)return;await cloud.fb.au.signOut(cloud.fb.auth);toast('Odjavljen. Podatki ostanejo na tej napravi.')}
async function cloudSyncNow(){if(!cloud.user)return;if(cloud.unsub){cloud.unsub();cloud.unsub=null}await cloudStart();cloudRefreshUi();toast('Sinhronizacija končana.')}
function cloudBoxHtml(){const u=cloud.user;if(!cloudConfigured())return '<div class="status">Firebase še ni nastavljen. V kodi vpiši podatke svojega projekta v <span class="mono">FIREBASE_CONFIG</span>.</div>';if(cloud.failed)return `<div class="status bad">${esc(cloud.failed)}</div>`;if(!cloud.fb)return '<div class="help">Nalagam prijavo …</div>';
 if(!u)return `<button type="button" class="btn" data-action="cloudSignIn">${GOOGLE_G} Prijava z Google računom</button><div class="help">Recepti, priljubljeni, nakupovalni seznam in osnovne nastavitve se sinhronizirajo med napravami. Gemini API ključ ostane samo na tej napravi.</div>`;
 return `<div class="cloud-user"><strong>${esc(u.displayName||'Prijavljen')}</strong><div class="help">${esc(u.email||'')}</div></div><div class="help" id="cloudStatus">${esc(cloud.status)}</div><div class="split-actions"><button type="button" class="btn ghost sm" data-action="cloudSync">Sinhroniziraj zdaj</button><button type="button" class="btn ghost sm" data-action="cloudSignOut">Odjava</button></div>`}
function cloudSettingsHtml(){return `<h3 style="font-size:14px;margin:22px 0 7px">Sinhronizacija med napravami</h3><div class="cloud-card" id="cloudBox">${cloudBoxHtml()}</div>`}
window.addEventListener('online',()=>{if(cloud.user&&cloud.ready&&lsGet('recepti-ai.dirty')==='1')cloudPush()});

/* ===== Ročno dodajanje živil na nakupovalni seznam ===== */
function shopAddForm(){return `<div class="shopadd"><input id="shopName" class="input" placeholder="Dodaj živilo (npr. mleko ali 2 l mleka)" autocomplete="off" enterkeyhint="done"><input id="shopQty" class="input" placeholder="Količina" autocomplete="off"><select id="shopAisle" class="select" aria-label="Oddelek"><option value="">Samodejno</option>${AISLE_ORDER.map(a=>`<option>${esc(a)}</option>`).join('')}</select><button type="button" class="btn" data-action="addShop">${icon('plus',16)} Dodaj</button></div>`}
function addShop(){const nameEl=document.getElementById('shopName');if(!nameEl)return;let name=nameEl.value.trim().replace(/\s+/g,' ');let qty=(document.getElementById('shopQty')?.value||'').trim();const forced=document.getElementById('shopAisle')?.value||'';
 if(!name){toast('Vpiši ime živila.');nameEl.focus();return}
 if(!qty){const m=name.match(/^(\d+(?:[.,]\d+)?)\s*(kg|dag|g|l|dl|ml|kosov|kosa|kos|pkt|zavojček|zavojčka|steklenica|steklenice|škatla|škatle|vrečka|vrečke|šopek|glava|glave)?\s+(.+)$/i);if(m&&m[3]){qty=(m[1]+' '+(m[2]||'')).trim();name=m[3]}}
 name=name.charAt(0).toUpperCase()+name.slice(1);const q=pq(qty);const k=name.toLowerCase();state.shop=state.shop||[];
 const ex=state.shop.find(y=>!y.done&&y.k===k&&y.u===q.u&&(y.n!=null)===(q.n!=null));
 if(ex){if(q.n!=null)ex.n=+(ex.n+q.n).toFixed(2);ex.from=ex.from||[];if(!ex.from.includes('Ročno'))ex.from.push('Ročno')}
 else state.shop.push({id:uid(),k,name,n:q.n,u:q.u,aisle:forced||aisleOf({name}).n,emoji:ingredientEmoji({name}),done:false,from:['Ročno']});
 save();render();toast('Dodano: '+name);const n2=document.getElementById('shopName');if(n2)n2.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='shopName'||e.target.id==='shopQty')){e.preventDefault();addShop()}});
function cloudAction(a){if(a==='cloudSignIn'){cloudSignIn().catch(e=>toast(e.message));return true}if(a==='cloudSignOut'){cloudSignOut().catch(e=>toast(e.message));return true}if(a==='cloudSync'){cloudSyncNow().catch(e=>toast(e.message));return true}if(a==='addShop'){addShop();return true}return false}
const _extra=extra;extra=function(a,btn){return cloudAction(a)||_extra(a,btn)};
setupPWA();render();importSharedFromHash();initCloud();
window.addEventListener('hashchange',importSharedFromHash);
</script>
</body>
