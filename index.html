<style>
:root{--bg:#f7f8f6;--surface:#fff;--surface2:#fff8ef;--text:#17202a;--muted:#6b7280;--line:#e7e5e4;--brand:#d97706;--brand2:#f59e0b;--brandSoft:#fff0d5;--success:#16845b;--danger:#c2410c;--shadow:0 12px 35px rgba(23,32,42,.08);--radius:22px;--navH:76px}
html.dark{--bg:#0f1418;--surface:#151b20;--surface2:#1d1710;--text:#f4f7f8;--muted:#aab2b9;--line:#2a3239;--brandSoft:#3a2814;--shadow:0 16px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;color:var(--text);background:var(--bg);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--brand);font-weight:700}
.app{max-width:980px;margin:0 auto;padding-bottom:calc(var(--navH) + 48px)}
.top{position:sticky;top:0;z-index:40;padding:14px 18px 12px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center;min-width:0}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(217,119,6,.25);flex:none}.brandmark svg{width:23px;height:23px}.brandtitle{font-size:18px;font-weight:800;line-height:1.05}.brandsub{font-size:12px;color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:7px;align-items:center}.top-install{box-shadow:none;padding:9px 11px;border-radius:12px;white-space:nowrap}.top-actions .btn-install[hidden]{display:none!important}.brandmark svg{width:30px;height:30px}.icon-btn svg{width:20px;height:20px}.navitem svg,.btn svg,.close svg,.install-icon svg{flex:none}.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:13px;display:grid;place-items:center}.icon-btn:hover{color:var(--text);border-color:#d0cbc7}.icon-btn.small{width:36px;height:36px;border-radius:11px}
main{padding:18px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero-main{padding:22px;min-height:230px;background:linear-gradient(145deg,var(--surface),var(--surface2))}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:9px}.hero h2{font-size:clamp(28px,5vw,44px);line-height:1.02;margin:0 0 10px;max-width:620px}.hero p{color:var(--muted);line-height:1.5;margin:0 0 18px;max-width:620px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700}.chip.active{color:var(--brand);background:var(--brandSoft);border-color:#f0c786}.hero-side{padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}.metric{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}.metric:last-child{border-bottom:0}.metric span{color:var(--muted);font-size:13px}.metric b{font-size:18px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:20px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:4px 0 0}.searchbar{display:flex;gap:8px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 13px;border-radius:13px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#e2a24a;box-shadow:0 0 0 3px rgba(245,158,11,.12)}.search-wrap{position:relative;flex:1}.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.search-wrap input{padding-left:39px}.btn{border:0;background:linear-gradient(135deg,var(--brand),#ea8b0a);color:white;padding:12px 15px;border-radius:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 16px rgba(217,119,6,.16)}.btn:hover{filter:brightness(.98)}.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.soft{background:var(--brandSoft);color:var(--brand);box-shadow:none}.btn.danger{background:#fff4ee;color:var(--danger);box-shadow:none;border:1px solid #f3c8b2}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.sm{padding:9px 11px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe-card{overflow:hidden;position:relative}.recipe-visual{height:120px;background:radial-gradient(circle at 20% 20%,#fff1c6,transparent 38%),linear-gradient(135deg,#5b2b11,#b65c13);display:flex;align-items:flex-end;padding:12px;color:#fff;position:relative}.recipe-visual .emoji{font-size:54px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}.recipe-visual .badge{position:absolute;left:11px;top:11px;background:rgba(255,255,255,.17);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);padding:6px 8px;border-radius:999px;font-size:10px;font-weight:800}.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.18);color:#fff;display:grid;place-items:center}.recipe-body{padding:14px}.recipe-title{font-size:17px;font-weight:800;line-height:1.16;margin:0 0 7px}.recipe-meta{display:flex;gap:10px;color:var(--muted);font-size:11px;flex-wrap:wrap}.recipe-actions{display:flex;gap:7px;margin-top:12px}.recipe-actions .btn{flex:1}.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:50;width:min(980px,100%);height:var(--navH);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.navitem{border:0;background:transparent;color:var(--muted);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:10px;font-weight:800}.navitem.active{color:var(--brand);background:var(--brandSoft)}.fab{position:fixed;right:max(18px,calc((100vw - 980px)/2 + 18px));bottom:calc(var(--navH) + 13px);z-index:45;border:0;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px rgba(217,119,6,.28)}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(15,20,24,.48);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet.hidden{display:none}.sheet-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 18px 18px;box-shadow:0 24px 70px rgba(0,0,0,.22);padding:18px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.sheet-head h2{margin:0;font-size:22px}.close{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;display:grid;place-items:center;color:var(--muted)}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field small,.help{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:13px;font-size:12px;font-weight:700}.check input{accent-color:var(--brand)}.range{display:flex;gap:7px;flex-wrap:wrap}.range button{flex:1;min-width:78px}.split-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.split-actions>*{flex:1}.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}.dotspin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.detail-hero{padding:18px;background:linear-gradient(145deg,var(--surface),var(--surface2));border-radius:22px;border:1px solid var(--line)}.detail-title{font-size:31px;line-height:1.04;margin:0 0 8px}.detail-kicker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{background:var(--brandSoft);color:var(--brand);padding:6px 8px;border-radius:999px;font-size:10px;font-weight:900}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.detail-actions .btn{flex:1;min-width:130px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.detail-box{padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.detail-box .detail-list{display:grid;gap:8px}.detail-box .detail-list>div{font-size:13px;line-height:1.55;color:var(--text)}.detail-box .detail-list>div strong{color:var(--brand)}.detail-note{padding:12px 13px;border-radius:14px;background:var(--brandSoft);color:var(--text);font-size:12px;line-height:1.5;margin-top:10px}.detail-box h3{margin:0 0 9px;font-size:14px}.ingredient{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.ingredient:last-child{border-bottom:0}.step{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:10px 0}.stepnum{width:28px;height:28px;border-radius:10px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:900}.note{padding:11px 12px;border-radius:14px;background:#fffaf0;border:1px solid #f3ddb8;color:#7c4a02;font-size:12px;line-height:1.5}.share-preview{white-space:pre-wrap;background:var(--surface2);padding:12px;border:1px solid var(--line);border-radius:14px;font-size:12px;line-height:1.5}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.toggle{width:48px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--line);padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}.toggle.on{background:var(--brand)}.toggle.on i{transform:translateX(18px)}.status{padding:10px 12px;border-radius:13px;background:var(--surface2);font-size:12px;color:var(--muted)}.status.ok{background:#ebfbf3;color:#176845}.status.bad{background:#fff3ef;color:#a03a1b}
.install-card{padding:14px;border:1px dashed #d9ad72;border-radius:16px;background:var(--surface2)}.install-row{display:flex;align-items:center;gap:12px}.install-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;flex:none}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.smallcaps{text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:900;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + 18px);transform:translate(-50%,20px);z-index:100;background:#20262b;color:#fff;padding:11px 14px;border-radius:14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.18)}.toast.show{opacity:1;transform:translate(-50%,0)}

const SAMPLE=[{"id": "sample-1", "title": "Piščanec z limono in medom", "subtitle": "Zlato zapečena stegna v lepljivi limonino-medeni glazuri, ob njih hrustljavi krhlji krompirja z vonjem po česnu. Vse skupaj na enem pekaču.", "category": "Kosilo", "servings": 2, "prepMinutes": 15, "cookMinutes": 40, "difficulty": "Lahko", "leftoversNextDay": true, "appliances": ["pecica"], "equipment": ["Velik pekač", "Skleda", "Termometer za meso (neobvezno)"], "ingredients": [{"name": "Piščančja stegna brez kosti, s kožo", "qty": "400 g", "section": "Meso"}, {"name": "Krompir (voščen)", "qty": "500 g", "section": "Priloga"}, {"name": "Limona (sok in lupinica)", "qty": "1 velika", "section": "Glazura"}, {"name": "Tekoči med", "qty": "1 žlica", "section": "Glazura"}, {"name": "Olivno olje", "qty": "2 žlici", "section": "Osnova"}, {"name": "Česen", "qty": "3 stroki", "section": "Osnova"}, {"name": "Dimljena paprika", "qty": "1/2 žličke", "section": "Začimbe"}, {"name": "Sol in sveže mlet poper", "qty": "po okusu", "section": "Začimbe"}, {"name": "Svež timijan ali rožmarin", "qty": "nekaj vejic", "section": "Za serviranje"}], "steps": ["Pečico segrej na 210 °C (zgoraj-spodaj ali s ventilatorjem na 200 °C). Pekač naj bo prazen in suh.", "Krompir operi in nareži na krhlje debeline približno 2 cm. Zmešaj ga z 1 žlico olja, 1/2 žličke soli in poprom, da je vsak kos rahlo premazan.", "Krompir razporedi po pekaču v eni plasti in ga peci 10 minut. Tako dobi prednost, saj potrebuje več časa kot meso.", "Medtem v skledi zmešaj sok in lupinico limone, med, preostalo olje, stisnjen česen, dimljeno papriko in ščepec soli. Piščanca s papirnato brisačo osuši, da se koža lepo zapeče, in ga prevrti v marinadi.", "Krompir na pekaču potisni na rob, piščanca položi s kožo navzgor v sredino, preostalo marinado prelij čez vse.", "Peci še 25–30 minut. Na polovici pečenja prelij meso s sokovi iz pekača. Gotovo je, ko je koža zlatorjava in sok bister ali ko termometer v najdebelejšem delu pokaže 75 °C.", "Pekač vzemi iz pečice in pusti počivati 5 minut. Potresi s svežim timijanom in postrezi še toplo, sokove iz pekača prelij čez krompir."], "prepAhead": ["Piščanca lahko v marinadi pustiš v hladilniku do 12 ur. Čim dlje je v njej, bolj aromatičen bo.", "Krompir nareži vnaprej in ga do pečenja hrani v hladni vodi, nato ga dobro osuši."], "tips": ["Za bolj hrustljavo kožo naj bo meso res suho in ne prenatrpaj pekača.", "Če limonina glazura prehitro potemni, pekač na zadnjih 10 minut pokrij s folijo.", "Odlično se poda ob zeleni solati z gorčično-limonino zaseko."], "substitutions": [{"from": "med", "to": "javorjev sirup", "note": "enaka količina, rahlo bolj karameliziran okus"}, {"from": "piščančja stegna", "to": "piščančje prsi", "note": "skrajšaj pečenje za 5–8 minut, da ostanejo sočne"}], "storage": ["V zaprti posodi v hladilniku do 3 dni.", "Ponovno segrej v pečici na 180 °C 10 minut, da koža spet postane hrustljava."], "nextDayPlan": "Naslednji dan meso pretrgaj in ga zloži v hladno solato ali tortiljo z jogurtovim prelivom. Krompir segrej v airfryerju ali pečici.", "shopping": ["400 g piščančjih stegen s kožo", "500 g krompirja", "1 velika limona", "tekoči med", "česen", "dimljena paprika", "svež timijan"], "v": 2}, {"id": "sample-2", "title": "Kremni losos z limeto in špinačo", "subtitle": "Svilnat losos z hrustljavo skorjico v svetli omaki iz limete in smetane. Večerja za dva, ki je pripravljena v pol ure in z eno samo ponvijo.", "category": "Večerja", "servings": 2, "prepMinutes": 8, "cookMinutes": 18, "difficulty": "Lahko", "leftoversNextDay": false, "appliances": ["indukcija"], "equipment": ["Velika nelepljiva ponev s pokrovom", "Ribja lopatica ali široka lopatka"], "ingredients": [{"name": "Fileja lososa s kožo (2 x 150 g)", "qty": "300 g", "section": "Ribe"}, {"name": "Smetana za kuhanje", "qty": "150 ml", "section": "Omaka"}, {"name": "Limeta (lupinica in sok)", "qty": "1", "section": "Omaka"}, {"name": "Mlada špinača", "qty": "120 g", "section": "Zelenjava"}, {"name": "Česen", "qty": "2 stroka", "section": "Osnova"}, {"name": "Maslo", "qty": "1 žlica", "section": "Osnova"}, {"name": "Sol, poper", "qty": "po okusu", "section": "Začimbe"}], "steps": ["Lososa vzemi iz hladilnika 10 minut pred pripravo in ga s papirnato brisačo temeljito osuši. Obe strani posoli in popopraj.", "Ponev segrej na srednje močni do močni stopnji indukcije (približno 7 od 9). V ponev daj maslo. Ko se začne peniti, položi lososa s kožo navzdol.", "Peci 4–5 minut brez premikanja, dokler koža ne postane hrustljava in se meso ob robu obarva do polovice debeline. Obrni in peci še 2 minuti, nato ribo vzemi na krožnik.", "Moč zmanjšaj na srednjo (približno 5). V isti ponvi 30 sekund dušiš sesekljan česen, da zadiši, a ne porjavi. Dodaj špinačo in jo mešaj 1 minuto, da oveni.", "Prilij smetano, dodaj naribano lupinico in polovico soka limete. Kuhaj na rahlem vretju 3 minute, da se omaka malo zgosti in oblepi žlico. Poskusi in po potrebi dosoli.", "Lososa vrni v omako s kožo navzgor, pokrij in pusti 1–2 minuti pri najnižji moči. Jed je pripravljena, ko je sredica še rahlo svetleča in se z vilicami razdeli na lističe.", "Postrezi takoj, ob kuhanem rižu, krompirju v kosih ali kruhu za pomakanje. Dodaj še nekaj kapljic limetinega soka."], "prepAhead": ["Česen in limeto pripravi vnaprej, losos naj se ogreje na sobno temperaturo."], "tips": ["Če se losos lepi, ga ne vleci s silo. Ko se skorja zapeče, se sama odlepi.", "Omaka naj ne vre premočno, da se smetana ne loči.", "Pri 4 osebah uporabi večjo ponev ali ribo speci v dveh delih."], "substitutions": [{"from": "smetana za kuhanje", "to": "kokosovo mleko", "note": "aromatičnejša omaka, odlično z limeto"}, {"from": "špinača", "to": "mladi grah ali brokoli", "note": "brokoli prej 3 minute podušiš z malo vode"}], "storage": ["Najboljši je sveže pripravljen. Ostanke shrani v hladilniku do 1 dan."], "nextDayPlan": "", "shopping": ["300 g lososovega fileja s kožo", "150 ml smetane za kuhanje", "1 limeta", "120 g mlade špinače", "česen", "maslo"], "v": 2}, {"id": "sample-3", "title": "Airfryer tortilja-pizza", "subtitle": "Tanka kot papir in hrustljava kot dober pizzin rob: stopljena mocarela, dišeča origanova omaka in vroč zalogaj v samo osmih minutah.", "category": "Prigrizek", "servings": 2, "prepMinutes": 5, "cookMinutes": 8, "difficulty": "Zelo lahko", "leftoversNextDay": false, "appliances": ["airfryer"], "equipment": ["Airfryer", "Peki papir za airfryer (neobvezno)", "Žlica"], "ingredients": [{"name": "Večji tortilji (premer 20–24 cm)", "qty": "2", "section": "Osnova"}, {"name": "Paradižnikova omaka ali passata", "qty": "4 žlice", "section": "Omaka"}, {"name": "Posušen origano", "qty": "1/2 žličke", "section": "Omaka"}, {"name": "Naribana mocarela", "qty": "150 g", "section": "Nadev"}, {"name": "Šunka ali salama v rezinah", "qty": "80 g", "section": "Nadev"}, {"name": "Olivno olje", "qty": "1 žlička", "section": "Zaključek"}, {"name": "Sveža bazilika ali rukola", "qty": "šopek", "section": "Za serviranje"}], "steps": ["Airfryer predgrej na 190 °C za 3 minute. Če imaš peki papir, ga položi na dno košare in ga obtežiš s tortiljo, da ne odleti.", "V skledici zmešaj paradižnikovo omako in origano. Tortilji namaži z omako od sredine proti robu, a pusti 1 cm roba nepremazanega.", "Posuj z mocarelo, nato s šunko. Nadeva ne daj preveč, saj bi sicer sir pobegnil in tortilja ne bi bila hrustljava.", "Ena tortilja naenkrat: položi jo v košaro in peci 5–7 minut pri 190 °C. Pizza je gotova, ko je sir mehurčast in zlato pikast, rob pa hrustljav.", "Pazi, da se tortilja ne dvigne in ne dotakne grelca. Po potrebi jo na kratko pritisni z vilicami ali pa jo prekrij z drugo tortiljo, ko jo daš v košaro.", "Vzemi jo ven, pokapaj z kapljico olivnega olja in potresi s svežo baziliko ali rukolo. Pusti jo 1 minuto počivati, nato jo razreži na krhlje in postrezi."], "prepAhead": ["Omako z origanom lahko pripraviš dan prej in jo hraniš v hladilniku."], "tips": ["Za še bolj hrustljavo osnovo tortiljo 1 minuto pred nadevom samo pogrej v airfryerju.", "Poskusi različico s salamo in čilijem ali z gobami in rukolo.", "Za sladko-pekoč preliv pico na koncu pokapaj z malo medu in čilijevega olja."], "substitutions": [{"from": "šunka", "to": "šampinjoni", "note": "narezane na tanke lističe, za brezmesno različico"}, {"from": "mocarela", "to": "edamec ali gavda", "note": "bolj slan in močnejši okus"}], "storage": ["Najboljša je takoj po peki. Ostanke shrani v hladilniku in jih 2 minuti segrej v airfryerju pri 180 °C."], "nextDayPlan": "", "shopping": ["2 večji tortilji", "paradižnikova omaka", "posušen origano", "150 g naribane mocarele", "80 g šunke", "sveža bazilika ali rukola"], "v": 2}].map((x,i)=>({...x,createdAt:Date.now()-86400000*(2+2*i)}));
let state=loadState();let activeTab='home';let search='';let deferredInstall=null;let speaking=false;let currentRecipeId=null;let busy=false;
function loadState(){try{const raw=localStorage.getItem(APP_KEY);if(raw){const x=JSON.parse(raw);return {...DEFAULT_STATE,...x,settings:{...DEFAULT_STATE.settings,...(x.settings||{})},recipes:(Array.isArray(x.recipes)?x.recipes:[]).map(r=>{const n=SAMPLE.find(z=>z.id===r.id);return n&&!r.v?{...n,createdAt:r.createdAt||n.createdAt}:r})};}}catch(e){}return {...DEFAULT_STATE,recipes:SAMPLE.map(x=>({...x}))};}
function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state));}catch(e){toast('Shranjevanje v brskalnik ni uspelo.');}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3000)}
function isFav(id){return state.favorites.includes(id)}
function toggleFav(id){state.favorites=isFav(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();toast(isFav(id)?'Recept dodan med priljubljene.':'Odstranjeno iz priljubljenih.');}
function getRecipe(id){return state.recipes.find(r=>r.id===id)}
function recipeEmoji(r){const CATICONS={'cup': '<path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 10h1.5a2 2 0 0 1 0 4H16M8 4v2M12 4v2"/>', 'plate': '<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.5"/><path d="M3 5v5M5.5 5v5M3 8h2.5M4.2 10v9M20 5c-1.6 1.2-2.4 3-2.4 5h2.4M20 5v14"/>', 'bowl': '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 20h8M9 3c-1 1.2 1 2.3 0 3.5M13 3c-1 1.2 1 2.3 0 3.5"/>', 'cake': '<path d="M4 20h16M6 20v-5h12v5M5 15c0-3 3-5 7-5s7 2 7 5M12 10V6"/>', 'leaf': '<path d="M12 8c-3-2-7 0-7 5 0 4 3 7 5 7 1 0 1.2-.5 2-.5s1 .5 2 .5c2 0 5-3 5-7 0-5-4-7-7-5Z"/><path d="M12 8c0-2 1-3.5 3-4"/>'};const s=(r.category||'').toLowerCase();const k=s.includes('slad')?'cake':s.includes('zaj')?'cup':s.includes('prigr')?'leaf':(s.includes('večer')||s.includes('juha'))?'bowl':'plate';return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${CATICONS[k]}</svg>`}
function heart(on,sz=18){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20.5 8.7c0 5.6-8.5 10.8-8.5 10.8S3.5 14.3 3.5 8.7A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.5 2.7Z"/></svg>`}
function customApps(){return (state.settings.customAppliances||[]).map(c=>[c.id,c.label,''])}
function allAppliances(){const h=state.settings.hiddenAppliances||[];return [...APPLIANCES.filter(a=>!h.includes(a[0])),...customApps()]}
function applianceLabel(id){return [...APPLIANCES,...customApps()].find(a=>a[0]===id)?.[1]||id}
function displayAppliances(r){return (r.appliances||[]).map(applianceLabel).join(' · ')||'po želji'}
function nav(){const items=[['home','Dom','home'],['generate','Ustvari','spark'],['saved','Recepti','book'],['favorites','Priljubljeno','heart']];document.getElementById('nav').innerHTML=items.map(([id,label,icn])=>`<button class="navitem ${activeTab===id?'active':''}" data-action="tab" data-tab="${id}">${icon(icn,22)}<span>${label}</span></button>`).join('');}
function render(){nav();const tb=document.getElementById('themeButton');if(tb)tb.innerHTML=icon(state.settings.theme==='dark'?'sun':'moon',20);const sb=document.getElementById('settingsButton');if(sb)sb.innerHTML=icon('settings',20);const ib=document.getElementById('btnInstall');if(ib)ib.innerHTML=icon('download',16)+'<span>Namesti</span>';const v=document.getElementById('view');if(activeTab==='home')v.innerHTML=renderHome();else if(activeTab==='generate')v.innerHTML=renderGenerate();else if(activeTab==='saved')v.innerHTML=renderSaved(false);else if(activeTab==='favorites')v.innerHTML=renderSaved(true);}
function renderHome(){return `<section class="hero"><div class="card hero-main"><div class="eyebrow">Kuhaj po svoje</div><h2>Recept, ki se prilagodi tvoji kuhinji.</h2><p>Nastavi aparate, čas, število oseb in sestavine, ki jih imaš doma. Gemini nato sestavi recept – in ga lahko še popraviš z glasom ali besedilom.</p><div class="chips"><button class="chip active" data-action="generate">${icon('spark',16)} Ustvari recept</button><button class="chip" data-action="saved">Moji recepti</button><button class="chip" data-action="newRecipe">Dodaj svoj recept</button><button class="chip" data-action="favorites">${heart(false,13)} Priljubljeni</button></div></div></section><div class="section-head"><div><h2>Zadnji recepti</h2><p>Nadaljuj tam, kjer si končal.</p></div><button class="btn ghost sm" data-action="saved">Prikaži vse</button></div>${renderRecipeGrid(state.recipes.slice(0,4))}`}
function renderRecipeGrid(list){if(!list.length)return `<div class="card empty">Še ni shranjenih receptov. Ustvari prvega z gumbom <strong>Ustvari</strong>.</div>`;return `<div class="grid">${list.map(recipeCard).join('')}</div>`}
function recipeCard(r){return `<article class="card recipe-card"><div class="recipe-visual"><span class="badge">${esc(r.category||'Recept')}</span><span class="emoji">${recipeEmoji(r)}</span><button class="fav" data-action="fav" data-id="${esc(r.id)}" aria-label="Priljubljeni">${heart(isFav(r.id))}</button></div><div class="recipe-body"><h3 class="recipe-title">${esc(r.title)}</h3><div class="recipe-meta"><span style="display:inline-flex;gap:4px;align-items:center">${icon('clock',13)} ${(+r.prepMinutes||0)+(+r.cookMinutes||0)} min</span><span style="display:inline-flex;gap:4px;align-items:center">${icon('users',13)} ${+r.servings||2}</span><span>${esc(r.difficulty||'')}</span></div><p style="color:var(--muted);font-size:12px;line-height:1.45;margin:8px 0 0">${esc(r.subtitle||'')}</p><div class="recipe-actions"><button class="btn sm" data-action="open" data-id="${esc(r.id)}">Odpri</button><button class="btn ghost sm" data-action="aiEdit" data-id="${esc(r.id)}">${icon('spark',15)} Prilagodi</button></div></div></article>`}
function renderSaved(onlyFav){let list=state.recipes.filter(r=>!onlyFav||isFav(r.id));if(search.trim()){const q=search.toLowerCase();list=list.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}return `<div class="section-head"><div><div class="eyebrow">${onlyFav?'Shranjeni priljubljeni':'Moja zbirka'}</div><h2>${onlyFav?'Priljubljeni recepti':'Vsi recepti'}</h2><p>${onlyFav?'Recepti, do katerih se rad vrneš.':'Išči, urejaj, deli in prilagajaj.'}</p></div><div style="display:flex;gap:6px"><button class="btn ghost sm" data-action="newRecipe">${icon('edit',14)} Ročno</button><button class="btn sm" data-action="generate">${icon('spark',14)} Z AI</button></div></div><div class="searchbar"><div class="search-wrap">${icon('search',18)}<input class="input" value="${esc(search)}" placeholder="Išči po naslovu, sestavini ali aparatu …" data-search></div><button class="icon-btn" data-action="clearSearch">${icon('close',18)}</button></div><div style="height:10px"></div>${renderRecipeGrid(list)}`}
function timeButtons(){return `<div class="range">${TIMES.map(([v,l])=>`<button type="button" class="btn soft sm time-opt${String(state.settings.time||'45')===v?' active':''}" data-time="${v}">${l}</button>`).join('')}</div>`}
function renderGenerate(){return `<section class="card" style="padding:18px"><div class="eyebrow">AI kuhinjski kopilot</div><h2 style="margin:0 0 7px;font-size:27px">Kaj danes kuhamo?</h2><p style="margin:0;color:var(--muted);font-size:13px;line-height:1.5">Povej jed ali samo situacijo. Naj AI upošteva tvoja pravila in naprave.</p><div class="field"><label>Želja</label><div style="display:flex;gap:8px"><textarea id="gWish" class="textarea" rows="3" placeholder="npr. želim sočnega piščanca, brez svinjine, nekaj za jutri"></textarea><button class="icon-btn" data-action="mic" data-target="gWish" aria-label="Govori">${icon('mic',20)}</button></div></div><div class="two"><div class="field"><label>Obrok</label><select id="gMeal" class="select">${MEALS.map(m=>`<option>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></div><div class="field"><label>Za koliko oseb</label><select id="gPeople" class="select">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===+state.settings.people?'selected':''}>${n} oseb</option>`).join('')}</select></div></div><div class="field"><label>Koliko časa imaš?</label>${timeButtons()}</div><div class="toggle-row"><div><strong>Za naslednji dan (priprava vnaprej)</strong><div class="help">AI bo količino in shranjevanje zasnoval tako, da je naslednji dan še uporabno.</div></div><button class="toggle" id="gLeft" data-on="false"><i></i></button></div><div class="field"><label>Aparati, ki so na voljo</label><div class="checks">${allAppliances().map(a=>`<label class="check"><input type="checkbox" value="${a[0]}" ${state.settings.appliances.includes(a[0])?'checked':''} data-gapp><span>${esc(a[1])}</span></label>`).join('')}</div></div><div class="field"><label>Prehranske omejitve / želje</label><input id="gDiet" class="input" value="${esc(state.settings.diet)}" placeholder="npr. brez laktoze, visoko beljakovinsko"></div><div class="field"><label>Sestavine, ki jih imaš doma</label><div style="display:flex;gap:8px"><textarea id="gHave" class="textarea" rows="2" placeholder="npr. piščanec, krompir, bučke, smetana …"></textarea><button class="icon-btn" data-action="mic" data-target="gHave">${icon('mic',20)}</button></div></div><div class="field"><label>Sestavine, ki jih nočeš / nimaš</label><input id="gAvoid" class="input" placeholder="npr. nimam jajc; ne maram koriandra"></div><div class="split-actions"><button class="btn" data-action="generateAI" ${busy?'disabled':''}>${busy?'<span class="loading"><span class="dotspin"></span> Generiram …</span>':`${icon('spark',16)} Generiraj recept`}</button><button class="btn ghost" data-action="settings">${icon('settings',16)} Nastavitve</button></div></section>`}
function openSheet(html){const s=document.getElementById('sheet');document.getElementById('sheetContent').innerHTML=html;s.classList.remove('hidden');document.body.style.overflow='hidden'}function closeSheet(){if(collectSettings())save();document.getElementById('sheet').classList.add('hidden');document.getElementById('sheetContent').innerHTML='';document.body.style.overflow=''}
function recipeDetail(r){const total=(+r.prepMinutes||0)+(+r.cookMinutes||0);const appList=(r.appliances||[]).map(applianceLabel);const ingredients=r.ingredients||[];const steps=r.steps||[];const prepAhead=r.prepAhead||[];const tips=r.tips||[];const storage=r.storage||[];return `<div class="sheet-head"><div><div class="smallcaps">${esc(r.category||'Recept')}</div><h2>${esc(r.title)}</h2></div><button class="close" data-action="close" aria-label="Zapri">${icon('close',18)}</button></div><div class="detail-hero"><div class="detail-kicker"><span class="pill">${icon('clock',12)} ${total} min</span><span class="pill">${icon('users',12)} ${r.servings||2} oseb</span><span class="pill">${esc(r.difficulty||'')}</span>${r.leftoversNextDay?'<span class="pill">Za jutri</span>':''}</div><h1 class="detail-title">${esc(r.title)}</h1><p style="margin:0;color:var(--muted);line-height:1.5">${esc(r.subtitle||'')}</p><div class="detail-actions"><button class="btn" data-action="fav" data-id="${esc(r.id)}">${heart(isFav(r.id),16)} ${isFav(r.id)?'Odstrani priljubljene':'Dodaj med priljubljene'}</button><button class="btn ghost" data-action="edit" data-id="${esc(r.id)}">${icon('edit',16)} Uredi</button><button class="btn ghost" data-action="aiEdit" data-id="${esc(r.id)}">${icon('spark',16)} Popravi z AI</button><button class="btn ghost" data-action="share" data-id="${esc(r.id)}">${icon('share',16)} Deli</button></div></div><div class="detail-grid"><div class="detail-box"><h3>${icon('basket',17)} Sestavine</h3>${ingredients.map(x=>`<div class="ingredient"><span>${esc(x.name)}</span><strong>${esc(x.qty)}</strong></div>`).join('')}</div><div class="detail-box"><h3>${icon('flame',17)} Priprava</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${appList.map(a=>`<span class="chip active">${esc(a)}</span>`).join('')}</div><p class="help" style="margin-top:12px">Skupaj: ${+r.prepMinutes||0} min priprave + ${+r.cookMinutes||0} min kuhanja/pečenja.</p>${(r.equipment||[]).length?`<div class="detail-note"><strong>Potrebna oprema:</strong> ${esc(r.equipment.join(', '))}</div>`:''}</div></div>${prepAhead.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('clock',17)} Priprava vnaprej</h3><div class="detail-list">${prepAhead.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}<div class="detail-box" style="margin-top:12px"><h3>${icon('chef',17)} Natančni koraki</h3>${steps.map((st,i)=>`<div class="step"><div class="stepnum">${i+1}</div><div style="font-size:13px;line-height:1.6">${esc(st)}</div></div>`).join('')}</div>${r.leftoversNextDay&&r.nextDayPlan?`<div class="detail-box" style="margin-top:12px"><h3>${icon('calendar',17)} Za naslednji dan</h3><div class="detail-note">${esc(r.nextDayPlan)}</div></div>`:''}${storage.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('box',17)} Shranjevanje</h3><div class="detail-list">${storage.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}${tips.length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('spark',17)} Nasveti</h3><div class="detail-list">${tips.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div></div>`:''}${(r.substitutions||[]).length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('swap',17)} Predlogi zamenjav</h3>${r.substitutions.map(s=>`<div class="ingredient"><span>${esc(s.from)} → ${esc(s.to)}</span><span style="color:var(--muted);max-width:45%;text-align:right">${esc(s.note||'')}</span></div>`).join('')}</div>`:''}${(r.shopping||[]).length?`<div class="detail-box" style="margin-top:12px"><h3>${icon('cart',17)} Nakupovalni seznam</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${r.shopping.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`:''}`}
function showRecipe(id){const r=getRecipe(id);if(!r)return;currentRecipeId=id;openSheet(recipeDetail(r))}
function editForm(r,isNew){return `<div class="sheet-head"><div><div class="smallcaps">${isNew?'Ročni vnos':'Urejanje'}</div><h2>${isNew?'Dodaj svoj recept':'Uredi recept'}</h2></div><button class="close" data-action="close">${icon('close',18)}</button></div><div class="field"><label>Naslov</label><input id="eTitle" class="input" value="${esc(r.title)}"></div><div class="field"><label>Podnaslov</label><input id="eSubtitle" class="input" value="${esc(r.subtitle||'')}"></div><div class="two"><div class="field"><label>Obrok / kategorija</label><input id="eCategory" class="input" list="mealList" value="${esc(r.category||'')}"><datalist id="mealList">${MEALS.map(m=>`<option value="${m[0].toUpperCase()+m.slice(1)}">`).join('')}</datalist></div><div class="field"><label>Oseb</label><input id="eServings" class="input" type="number" min="1" max="20" value="${+r.servings||2}"></div></div><div class="two"><div class="field"><label>Priprava (min)</label><input id="ePrep" class="input" type="number" min="0" value="${+r.prepMinutes||0}"></div><div class="field"><label>Kuhanje / pečenje (min)</label><input id="eCook" class="input" type="number" min="0" value="${+r.cookMinutes||0}"></div></div><div class="field"><label>Aparati</label><div class="checks">${allAppliances().map(a=>`<label class="check"><input type="checkbox" value="${a[0]}" ${(r.appliances||[]).includes(a[0])?'checked':''} data-eapp><span>${esc(a[1])}</span></label>`).join('')}</div></div><div class="field"><label>Sestavine – ena na vrstico, količina — sestavina</label><textarea id="eIngredients" class="textarea" rows="9" placeholder="400 g — piščančja stegna&#10;2 žlici — olivno olje&#10;sol">${esc((r.ingredients||[]).map(x=>`${x.qty} — ${x.name}`).join('\n'))}</textarea></div><div class="field"><label>Koraki – čim bolj natančno, eden na vrstico</label><textarea id="eSteps" class="textarea" rows="11" placeholder="Pečico segrej na 200 °C.&#10;Meso posoli in ga peci 25 minut, da je zlato rjavo.">${esc((r.steps||[]).join('\n'))}</textarea><small>Pri ročnem urejanju lahko dopišeš temperaturo, moč kuhalne plošče, čas, količino, velikost posode in znak pečenosti.</small></div><div class="field"><label>Priprava vnaprej – eden na vrstico</label><textarea id="ePrepAhead" class="textarea" rows="4">${esc((r.prepAhead||[]).join('\n'))}</textarea></div><div class="field"><label>Nasveti – eden na vrstico</label><textarea id="eTips" class="textarea" rows="5">${esc((r.tips||[]).join('\n'))}</textarea></div><div class="field"><label>Shranjevanje – eden na vrstico</label><textarea id="eStorage" class="textarea" rows="4">${esc((r.storage||[]).join('\n'))}</textarea></div><div class="field"><label>Navodilo za naslednji dan</label><textarea id="eNextDay" class="textarea" rows="3">${esc(r.nextDayPlan||'')}</textarea></div><div class="split-actions"><button class="btn" data-action="saveEdit" data-id="${esc(r.id)}">${icon('check',16)} Shrani spremembe</button><button class="btn ghost" data-action="close">Prekliči</button>${isNew?'':`<button class="btn danger" data-action="deleteRecipe" data-id="${esc(r.id)}">${icon('trash',16)} Izbriši</button>`}</div>`}
function openEditor(id){const r=getRecipe(id);if(r)openSheet(editForm(r))}
function parseIngredientsText(text){return text.split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split(/\s*[—–]\s*|\s+-\s+/);if(parts.length>1)return {qty:parts[0].trim(),name:parts.slice(1).join('—').trim(),section:'Glavno'};return {name:line,qty:'po potrebi',section:'Glavno'}})}
function saveEdit(id){let r=getRecipe(id);let isNew=false;if(!r&&draftRecipe&&draftRecipe.id===id){r=draftRecipe;isNew=true}if(!r)return;if(isNew&&!document.getElementById('eTitle').value.trim()){toast('Vpiši naslov recepta.');return}r.title=document.getElementById('eTitle').value.trim()||r.title;r.subtitle=document.getElementById('eSubtitle').value.trim();r.category=document.getElementById('eCategory').value.trim()||r.category;r.servings=Math.max(1,+document.getElementById('eServings').value||2);r.prepMinutes=Math.max(0,+document.getElementById('ePrep').value||0);r.cookMinutes=Math.max(0,+document.getElementById('eCook').value||0);r.ingredients=parseIngredientsText(document.getElementById('eIngredients').value);r.steps=document.getElementById('eSteps').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);r.prepAhead=(document.getElementById('ePrepAhead')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);r.tips=document.getElementById('eTips').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);r.storage=(document.getElementById('eStorage')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);r.nextDayPlan=(document.getElementById('eNextDay')?.value||'').trim();{const known=allAppliances().map(a=>a[0]);r.appliances=[...(r.appliances||[]).filter(x=>!known.includes(x)),...[...document.querySelectorAll('[data-eapp]:checked')].map(x=>x.value)]}if(isNew){state.recipes.unshift(r);draftRecipe=null}save();closeSheet();render();showRecipe(id);toast(isNew?'Recept dodan.':'Recept posodobljen.')}
function aiEditForm(r){return `<div class="sheet-head"><div><div class="smallcaps">AI prilagoditev</div><h2>Kako naj recept spremenim?</h2></div><button class="close" data-action="close">${icon('close',18)}</button></div><p style="color:var(--muted);line-height:1.45;font-size:13px">Lahko napišeš ali poveš navodilo. AI bo ohranil bistvo jedi in prilagodil sestavine, korake ter čas po tvoji zahtevi.</p><div class="field"><label>Navodilo</label><div style="display:flex;gap:8px"><textarea id="aiInstruction" class="textarea" rows="5" placeholder="npr. nimam jajc, prosim uporabi drugo vezivo; naredi za 5 oseb; uporabi samo airfryer; manj pekoče"></textarea><button class="icon-btn" data-action="mic" data-target="aiInstruction">${icon('mic',20)}</button></div></div><div class="split-actions"><button class="btn" data-action="runAiEdit" data-id="${esc(r.id)}">${icon('spark',16)} Prilagodi recept</button><button class="btn ghost" data-action="close">Prekliči</button></div><div class="status" style="margin-top:10px">Upoštevani bodo tudi tvoji aparati in prehranske nastavitve.</div>`}
function openAiEdit(id){const r=getRecipe(id);if(r)openSheet(aiEditForm(r))}
function shareText(r){return `${r.title}\n${r.subtitle||''}\n\nZa ${r.servings} oseb · ${(+r.prepMinutes||0)+(+r.cookMinutes||0)} min\n\nSestavine:\n${(r.ingredients||[]).map(x=>`• ${x.qty} ${x.name}`).join('\n')}\n\nPriprava:\n${(r.steps||[]).map((x,i)=>`${i+1}. ${x}`).join('\n')}`}
async function shareRecipe(r){const text=shareText(r);if(navigator.share){try{await navigator.share({title:r.title,text});toast('Recept je pripravljen za deljenje.');return}catch(e){if(e?.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Recept kopiran v odložišče.')}catch(e){openSheet(`<div class="sheet-head"><h2>Deli recept</h2><button class="close" data-action="close">${icon('close',18)}</button></div><div class="share-preview">${esc(text)}</div><div class="split-actions"><button class="btn" data-action="close">Zapri</button></div>`)}}
function importSharedFromHash(){try{const h=location.hash;if(!h.startsWith('#recipe='))return;const json=decodeURIComponent(escape(atob(h.slice(8))));const r=JSON.parse(json);r.id=uid();state.recipes.unshift(r);save();history.replaceState(null,'',location.pathname+location.search);showRecipe(r.id)}catch(e){}}
function encodeRecipe(r){const s=JSON.stringify(r);return btoa(unescape(encodeURIComponent(s)))}
function buildShareUrl(r){return `${location.origin}${location.pathname}#recipe=${encodeURIComponent(encodeRecipe(r))}`}
async function copyLink(r){try{await navigator.clipboard.writeText(buildShareUrl(r));toast('Povezava do recepta je kopirana.')}catch(e){toast('Povezave ni bilo mogoče kopirati.')}}
async function runAiEdit(id){const r=getRecipe(id);const instruction=(document.getElementById('aiInstruction')?.value||'').trim();if(!instruction){toast('Napiši, kaj želiš spremeniti.');return}busy=true;openSheet(`<div class="sheet-head"><h2>Prilagajam recept …</h2><button class="close" data-action="close">${icon('close',18)}</button></div><div class="loading"><span class="dotspin"></span> Gemini pripravlja prilagoditev.</div>`);try{const prompt=buildAdaptPrompt(r,instruction);const out=await callGemini(prompt);const merged=normalizeRecipe(out,r.servings);merged.id=r.id;merged.createdAt=r.createdAt||Date.now();state.recipes=state.recipes.map(x=>x.id===id?merged:x);save();closeSheet();render();showRecipe(id);toast('Recept je prilagojen z AI.')}catch(e){toast(e.message||'AI prilagoditev ni uspela.');openAiEdit(id)}finally{busy=false}}
function buildGeneratePrompt(form){const apps=form.apps.map(applianceLabel);return `Ustvari en sam res izvedljiv, zelo podroben domači recept v slovenščini. Recept mora biti napisan tako, da ga lahko uporabnik pripravi brez dodatnih vprašanj. Upoštevaj vse spodnje pogoje in ne uporabljaj aparata, ki ni na voljo.

UPORABNIKOVA ŽELJA: "${form.wish||'nekaj okusnega'}"
OBROK: ${form.meal}
ŠTEVILO OSEB: ${form.people}
ČASOVNA OMEJITEV: ${form.timeLabel}
ZA NASLEDNJI DAN (PRIPRAVA VNAPREJ): ${form.leftovers?'DA':'NE'}
RAZPOLOŽLJIVI APARATI: ${apps.join(', ')||'ni določeno'}
PREHRANSKE ŽELJE/OMEJITVE: ${form.diet||'brez posebnosti'}
SESTAVINE, KI SO DOMA: ${form.have||'ni navedeno'}
SESTAVINE/REČI, KI JIH NI ALI SE JIM ŽELI IZOGNITI: ${form.avoid||'nič posebnega'}

OBVEZNA PRAVILA ZA KAKOVOST: 
1. Za ${form.people} oseb navedi konkretne količine za vsako bistveno sestavino, z uporabnimi enotami (g, ml, kos, žlička, žlica).
2. Recept mora imeti jasen seznam opreme in natančen postopek.
3. Vsak korak napiši zelo konkretno: kaj narediš, s katero količino, v kateri posodi/položaju, na kateri temperaturi ali moči, koliko časa ter kako veš, da je korak zaključen.
4. Pri pečenju, airfryerju in pizza peči vedno navedi temperaturo v °C, način/ventilacijo, predgretje in okviren čas; upoštevaj, da se aparati razlikujejo.
5. Pri indukciji navedi smiselno stopnjo moči ali opis toplote (npr. srednja moč), pri mesu pa po potrebi dodaj znak pečenosti in priporočeno notranjo temperaturo.
6. Ne izmišljaj posebnih tehnik ali opreme. Domača oprema naj bo dovolj.
7. Če so podane sestavine doma, jih smiselno porabi. Če kakšna ni na voljo, predlagaj kulinarično smiselno zamenjavo in jo dejansko uporabi v receptu.
8. Če je vklopljena priprava za naslednji dan, recept prilagodi tako, da je naslednji dan kakovostno uporaben; dodaj natančno ohlajanje, shranjevanje in ponovno segrevanje.
9. Dodaj uporabne nasvete, pripravo vnaprej, shranjevanje ter morebitne zamenjave sestavin.
10. Ne uporabljaj nejasnih navodil kot so "speci do konca" brez dodatnega znaka pečenosti, časa ali temperature.
11. Piši živo in apetitno, kot dober kuharski avtor: podnaslov (subtitle) naj bo 1–2 stavka, ki opišeta okus, teksturo in vonj jedi, ne samo naštevanja sestavin.\n12. Korake piši v celih stavkih, razloži kratek razlog (npr. zakaj osušiti meso) in kako prepoznaš, da je korak uspel. Vsak recept naj ima vsaj 5 korakov.\n13. Dodaj 2–3 konkretne nasvete in idejo za serviranje ali dodatke.\n11. Vrni samo veljaven JSON po zahtevani shemi.`}
function buildAdaptPrompt(r,instruction){return `Prilagodi naslednji recept glede na uporabnikovo navodilo. Vrni CELoten posodobljen recept po zahtevani JSON shemi. Navodilo: "${instruction}".

UPORABNIKOVA KUHINJA: ${(state.settings.appliances||[]).map(applianceLabel).join(', ')||'ni določeno'}
PRIVZETO ŠTEVILO OSEB: ${state.settings.people}
PREHRANSKE NASTAVITVE: ${state.settings.diet||'brez posebnosti'}

OBSTOJEČ RECEPT:
${JSON.stringify(r)}

PRAVILA PRILAGODITVE:
- Pri manjkajoči sestavini izberi kulinarično logično zamenjavo, navedi količino in posodobi tudi korake.
- Pri spremembi števila oseb preračunaj vse bistvene količine in časovno prilagodi večje/manjše količine, kjer je to smiselno.
- Pri spremembi aparata prilagodi temperaturo, način segrevanja, posodo in čas.
- Pri spremembi prehranskih omejitev odstrani neustrezne sestavine in preveri, da se ne pojavijo ponovno v korakih.
- Vsak korak naj ostane zelo natančen: količina, temperatura/moč, čas in znak pečenosti, kjer je relevanten.
- Ohrani bistvo jedi, razen če uporabnik zahteva večjo spremembo.
- Vrni samo veljaven JSON po shemi.`}
async function callGemini(prompt){const key=(state.settings.apiKey||'').trim();if(!key)throw new Error('V nastavitvah manjka Gemini API ključ.');const model=(state.settings.model||MODEL_DEFAULT).trim();const body={systemInstruction:{parts:[{text:'Si izkušen kuhar in praktičen kulinarični asistent. Odgovarjaj samo v slovenščini in vrni veljaven JSON, ki ustreza dani shemi.'}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.6,responseMimeType:'application/json',responseSchema:recipeSchema}};const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});const data=await res.json().catch(()=>null);if(!res.ok){const msg=data?.error?.message||'';if(res.status===401||res.status===403)throw new Error('Gemini ključ nima dostopa do tega modela.');if(res.status===429)throw new Error('Gemini je dosegel omejitev zahtev.');throw new Error(msg||`Napaka ${res.status}.`)}const text=(data?.candidates?.[0]?.content?.parts||[]).filter(p=>p.text).map(p=>p.text).join('');if(!text)throw new Error('Gemini ni vrnil recepta.');try{return JSON.parse(text.replace(/^```json/i,'').replace(/```$/,'').trim())}catch(e){throw new Error('Gemini je vrnil neveljaven JSON. Poskusi še enkrat.')}}
function normalizeRecipe(r,servings=2){return {id:r.id||uid(),title:r.title||'Nov recept',subtitle:r.subtitle||'',category:r.category||'Kosilo',servings:+r.servings||servings,prepMinutes:+r.prepMinutes||0,cookMinutes:+r.cookMinutes||0,difficulty:r.difficulty||'Lahko',leftoversNextDay:!!r.leftoversNextDay,appliances:Array.isArray(r.appliances)?r.appliances:[],equipment:Array.isArray(r.equipment)?r.equipment:[],ingredients:Array.isArray(r.ingredients)?r.ingredients:[],steps:Array.isArray(r.steps)?r.steps:[],prepAhead:Array.isArray(r.prepAhead)?r.prepAhead:[],tips:Array.isArray(r.tips)?r.tips:[],substitutions:Array.isArray(r.substitutions)?r.substitutions:[],storage:Array.isArray(r.storage)?r.storage:[],nextDayPlan:r.nextDayPlan||'',shopping:Array.isArray(r.shopping)?r.shopping:[],createdAt:r.createdAt||Date.now()}}
async function generateAI(){if(busy)return;const wish=(document.getElementById('gWish')?.value||'').trim();const meal=document.getElementById('gMeal')?.value||'Kosilo';const people=+document.getElementById('gPeople')?.value||2;const time=document.querySelector('.time-opt.active')?.dataset.time||'45';const timeLabel=TIMES.find(x=>x[0]===time)?.[1]||'Do 45 min';const leftovers=document.getElementById('gLeft')?.dataset.on==='true';const apps=[...document.querySelectorAll('[data-gapp]:checked')].map(x=>x.value);const diet=(document.getElementById('gDiet')?.value||'').trim();const have=(document.getElementById('gHave')?.value||'').trim();const avoid=(document.getElementById('gAvoid')?.value||'').trim();if(!apps.length){toast('Izberi vsaj en aparat, ki ga imaš na voljo.');return}busy=true;setGenBtn(true);try{const out=await callGemini(buildGeneratePrompt({wish,meal,people,timeLabel,leftovers,apps,diet,have,avoid}));const r=normalizeRecipe(out,people);r.id=uid();r.createdAt=Date.now();state.recipes.unshift(r);state.lastGeneratedId=r.id;state.settings.people=people;save();busy=false;render();showRecipe(r.id);toast('Recept je shranjen.')}catch(e){busy=false;setGenBtn(false);toast(e.message||'Generiranje ni uspelo.')}}
function toggleLeft(){const b=document.getElementById('gLeft');if(!b)return;const on=b.dataset.on==='true';b.dataset.on=String(!on);b.classList.toggle('on',!on)}
function startVoice(targetId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Glasovni vnos v tem brskalniku ni podprt.');return}const rec=new SR();rec.lang='sl-SI';rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>toast('Poslušam …');rec.onerror=()=>toast('Glasovnega vnosa nisem mogel prebrati.');rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';const el=document.getElementById(targetId);if(el){el.value=(el.value?el.value+' ':'')+t;el.dispatchEvent(new Event('input',{bubbles:true}))}toast('Glasovni zapis dodan.');};rec.start()}
function openSettings(){const s=state.settings;openSheet(`<div class="sheet-head"><div><div class="smallcaps">Nastavitve</div><h2>Tvoja kuhinja</h2></div><button class="close" data-action="close">${icon('close',18)}</button></div><div class="field"><label>Ime</label><input id="sName" class="input" value="${esc(s.name||'')}" placeholder="Kako naj te kličem?"></div><div class="field"><label>Privzeto število oseb</label><select id="sPeople" class="select">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===+s.people?'selected':''}>${n} oseb</option>`).join('')}</select></div><div class="field"><label>Privzet čas priprave</label><select id="sTime" class="select">${TIMES.map(([v,l])=>`<option value="${v}" ${v===String(s.time||'45')?'selected':''}>${l}</option>`).join('')}</select><small>Ta čas je privzeto izbran pri ustvarjanju receptov z AI.</small></div><div class="field"><label>Prehranske želje ali omejitve</label><input id="sDiet" class="input" value="${esc(s.diet||'')}" placeholder="npr. brez laktoze, vegetarijansko"></div><div class="field"><label>Aparati, ki jih imaš na voljo</label><div class="checks">${allAppliances().map(a=>`<div class="check"><label class="chk"><input type="checkbox" value="${a[0]}" ${s.appliances.includes(a[0])?'checked':''} data-sapp><span>${esc(a[1])}</span></label><button type="button" class="rm" data-action="removeApp" data-id="${a[0]}" aria-label="Odstrani aparat" title="Odstrani aparat">${icon('close',14)}</button></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><input id="sNewApp" class="input" placeholder="Dodaj svoj aparat (npr. wok plošča)"><button type="button" class="btn ghost" data-action="addApp">Dodaj</button></div>${(s.hiddenAppliances||[]).length?`<button type="button" class="btn ghost sm" style="margin-top:8px" data-action="restoreApps">Obnovi odstranjene aparate</button>`:''}<small>Ti aparati so privzeto uporabljeni pri vsakem AI generiranju.</small></div><div class="field"><label>Gemini API ključ</label><input id="sKey" class="input mono" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.apiKey||'')}" placeholder="AIza…"><div class="split-actions" style="margin-top:8px"><button type="button" class="btn ghost sm" data-action="toggleKey">Pokaži</button><button type="button" class="btn ghost sm" data-action="testKey">Preveri</button><button type="button" class="btn sm" data-action="saveKey">${icon('check',14)} Shrani ključ</button></div><div class="help"><strong>Kako do ključa?</strong><br>Za pridobitev brezplačnega API ključa obiščite Google AI Studio:<br><a href="https://aistudio.google.com/app/api-keys" target="_blank" rel="noopener noreferrer">Pridobi ključ v Google AI Studio</a></div><div class="help">Ključ se shrani samo v tej napravi. Za produkcijsko aplikacijo je varneje klicati Gemini prek lastnega strežnika.</div></div><div class="field"><label>Model</label><input id="sModel" class="input mono" value="${esc(s.model||MODEL_DEFAULT)}"><div class="help">Privzeto je nastavljen stabilni <strong>${MODEL_DEFAULT}</strong>.</div></div><div class="split-actions"><button class="btn" data-action="saveSettings">${icon('check',16)} Shrani nastavitve</button></div><div class="help" id="saveState" style="text-align:center">Spremembe se shranjujejo samodejno.</div><h3 style="font-size:14px;margin:22px 0 7px">Tema in aplikacija</h3><div class="toggle-row"><div><strong>Temni način</strong><div class="help">Shranjeno na tej napravi.</div></div><button class="toggle ${document.documentElement.classList.contains('dark')?'on':''}" data-action="theme"><i></i></button></div><div class="install-card" style="margin-top:12px"><div class="install-row"><div class="install-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="#F5F0E8" stroke="#DDD5C8"/><g fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 38V51H44V38"/><path d="M20 38C13 38 12 28 19 26C19 19 28 17 32 22C36 17 45 19 45 26C52 28 51 38 44 38Z"/><path d="M20 45H44"/></g><path transform="translate(18,-3)" d="M32 7Q33.3 12.7 39 14Q33.3 15.3 32 21Q30.7 15.3 25 14Q30.7 12.7 32 7Z" fill="#D97706"/></svg></div><div><strong>Namesti Recepti AI</strong><div class="help">Na telefonu bo aplikacija izgledala kot samostojna aplikacija brez klasičnega brskalniškega okvirja.</div><button class="btn sm" data-action="install">Namesti na telefon</button></div></div></div><h3 style="font-size:14px;margin:22px 0 7px">Podatki</h3><div class="split-actions"><button class="btn ghost" data-action="export">Izvozi recepte (JSON)</button><button class="btn ghost" data-action="import">Uvozi recepte (JSON)</button><button class="btn danger" data-action="reset">Ponastavi</button></div><p class="help">Izvoz vsebuje recepte in priljubljene; API ključ se ne izvaža.</p>`)}
function collectSettings(){const g=id=>document.getElementById(id);if(!g('sName'))return false;const st=state.settings;st.name=g('sName').value.trim();st.people=+g('sPeople').value||2;st.diet=g('sDiet').value.trim();st.time=g('sTime')?.value||st.time||'45';st.appliances=[...document.querySelectorAll('[data-sapp]:checked')].map(x=>x.value);st.apiKey=g('sKey').value.trim();st.model=g('sModel').value.trim()||MODEL_DEFAULT;return true}
function saveSettings(){collectSettings();save();closeSheet();render();toast('Nastavitve shranjene.');}
async function testKey(){collectSettings();save();state.settings.apiKey=document.getElementById('sKey')?.value.trim()||state.settings.apiKey;state.settings.model=document.getElementById('sModel')?.value.trim()||state.settings.model;try{await callGemini('Vrni objekt z eno lastnostjo status, kjer je vrednost "ok".');toast('Gemini povezava deluje ✓')}catch(e){toast(e.message||'Povezava ne deluje.')}}
function exportData(){const payload={type:'recepti-ai-recepti',version:2,exportedAt:new Date().toISOString(),recipes:state.recipes,favorites:state.favorites};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`recepti-ai-recepti-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Recepti izvoženi v JSON.');}
function importData(){document.getElementById('importFile').click()}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);const incoming=Array.isArray(x)?x:(Array.isArray(x.recipes)?x.recipes:[]);if(!incoming.length)throw new Error('empty');const cleaned=incoming.map(normalizeRecipe);const byId=new Map(state.recipes.map(r=>[r.id,r]));cleaned.forEach(r=>byId.set(r.id,r));state.recipes=[...byId.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const favIncoming=Array.isArray(x.favorites)?x.favorites:[];state.favorites=[...new Set([...state.favorites,...favIncoming])].filter(id=>state.recipes.some(r=>r.id===id));save();closeSheet();render();toast(`${cleaned.length} receptov uvoženih.`)}catch(err){toast('Datoteka ni veljaven Recepti AI JSON izvoz.')}};rd.readAsText(f);e.target.value=''})
function resetApp(){if(!confirm('Res želiš izbrisati recepte in nastavitve?'))return;state={...DEFAULT_STATE,recipes:SAMPLE.map(x=>({...x})),favorites:[]};save();closeSheet();render();toast('Aplikacija je ponastavljena.');}
function toggleTheme(){const dark=document.documentElement.classList.toggle('dark');state.settings.theme=dark?'dark':'light';document.querySelectorAll('.toggle[data-action="theme"]').forEach(b=>b.classList.toggle('on',dark));save();render();}

async function installApp(){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;const b=document.getElementById('btnInstall');if(b)b.hidden=true;return}toast('Za neposredno namestitev mora brskalnik ponuditi namestitev aplikacije. Na iPhonu uporabi Deli → Dodaj na začetni zaslon.');}
async function handleAction(btn){const a=btn.dataset.action;if(extra(a,btn))return;if(a==='tab'){activeTab=btn.dataset.tab;search='';render();return}if(a==='home'){activeTab='home';render();return}if(a==='generate'){activeTab='generate';render();return}if(a==='saved'){activeTab='saved';render();return}if(a==='favorites'){activeTab='favorites';render();return}if(a==='theme'){toggleTheme();return}if(a==='settings'){openSettings();return}if(a==='close'){closeSheet();return}if(a==='fav'){toggleFav(btn.dataset.id);if(currentRecipeId===btn.dataset.id){showRecipe(btn.dataset.id)}return}if(a==='open'){showRecipe(btn.dataset.id);return}if(a==='edit'){openEditor(btn.dataset.id);return}if(a==='aiEdit'){openAiEdit(btn.dataset.id);return}if(a==='saveEdit'){saveEdit(btn.dataset.id);return}if(a==='runAiEdit'){await runAiEdit(btn.dataset.id);return}if(a==='share'){const r=getRecipe(btn.dataset.id);if(r){await shareRecipe(r)}return}if(a==='copyLink'){const r=getRecipe(btn.dataset.id);if(r)await copyLink(r);return}if(a==='generateAI'){await generateAI();return}if(a==='mic'){startVoice(btn.dataset.target);return}if(a==='toggleKey'){const x=document.getElementById('sKey');x.type=x.type==='password'?'text':'password';btn.textContent=x.type==='password'?'Pokaži':'Skrij';return}if(a==='saveSettings'){saveSettings();return}if(a==='testKey'){await testKey();return}if(a==='export'){exportData();return}if(a==='import'){importData();return}if(a==='reset'){resetApp();return}if(a==='install'){await installApp();return}if(a==='clearSearch'){search='';render();return}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();try{await handleAction(b)}catch(err){toast(err.message||'Napaka.')}}if(e.target.matches('.sheet'))closeSheet();if(e.target.matches('.time-opt')){document.querySelectorAll('.time-opt').forEach(x=>x.classList.remove('active'));e.target.classList.add('active')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){search=e.target.value;activeTab=activeTab==='favorites'?'favorites':'saved';render();const el=document.querySelector('[data-search]');if(el){el.focus();el.setSelectionRange(search.length,search.length)}}});
document.addEventListener('click',e=>{if(e.target.id==='gLeft'||e.target.closest('#gLeft'))toggleLeft()});

let draftRecipe=null;
function setGenBtn(on){const b=document.querySelector('[data-action="generateAI"]');if(!b)return;b.disabled=on;b.innerHTML=on?'<span class="loading"><span class="dotspin"></span> Generiram …</span>':icon('spark',16)+' Generiraj recept'}
function openNewRecipe(){const r=normalizeRecipe({category:'Kosilo',servings:+state.settings.people||2,prepMinutes:15,cookMinutes:30},state.settings.people);r.title='';r.id=uid();r.createdAt=Date.now();draftRecipe=r;openSheet(editForm(r,true))}
function reopenSettings(){const c=document.querySelector('.sheet-card');const y=c?c.scrollTop:0;openSettings();const n=document.querySelector('.sheet-card');if(n)n.scrollTop=y}
function extra(a,btn){
 if(a==='newRecipe'){openNewRecipe();return true}
 if(a==='saveKey'){collectSettings();save();toast(state.settings.apiKey?'API ključ shranjen.':'Polje s ključem je prazno.');const t=document.getElementById('saveState');if(t)t.textContent='Shranjeno ✓';return true}
 if(a==='addApp'){collectSettings();const l=(document.getElementById('sNewApp')?.value||'').trim();if(!l){toast('Vpiši ime aparata.');return true}if(allAppliances().some(x=>x[1].toLowerCase()===l.toLowerCase())){toast('Ta aparat že obstaja.');return true}const id='c-'+Date.now().toString(36);state.settings.customAppliances=[...(state.settings.customAppliances||[]),{id,label:l}];state.settings.appliances.push(id);save();reopenSettings();toast('Aparat dodan.');return true}
 if(a==='removeApp'){collectSettings();const id=btn.dataset.id,st=state.settings;if(id.startsWith('c-'))st.customAppliances=(st.customAppliances||[]).filter(c=>c.id!==id);else st.hiddenAppliances=[...new Set([...(st.hiddenAppliances||[]),id])];st.appliances=st.appliances.filter(x=>x!==id);save();reopenSettings();toast('Aparat odstranjen.');return true}
 if(a==='restoreApps'){collectSettings();state.settings.hiddenAppliances=[];save();reopenSettings();return true}
 if(a==='hideInstall'){state.settings.hideInstall=true;save();document.querySelector('.install-card')?.remove();const b=document.getElementById('btnInstall');if(b)b.hidden=true;return true}
 if(a==='deleteRecipe'){if(confirm('Izbrišem ta recept?')){const id=btn.dataset.id;state.recipes=state.recipes.filter(r=>r.id!==id);state.favorites=state.favorites.filter(x=>x!==id);save();closeSheet();render();toast('Recept izbrisan.')}return true}
 return false}
const _openSettings=openSettings;openSettings=function(){_openSettings();const c=document.querySelector('.install-card');if(!c)return;const sa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;if(sa||state.settings.hideInstall){c.remove();return}c.querySelector('.btn')?.insertAdjacentHTML('afterend',' <button type="button" class="btn ghost sm" data-action="hideInstall">Že nameščeno</button>')};
let _as;function autoSave(e){if(!e.target.closest||!e.target.closest('#sheetContent')||!document.getElementById('sName'))return;clearTimeout(_as);_as=setTimeout(()=>{if(collectSettings()){save();const t=document.getElementById('saveState');if(t)t.textContent='Shranjeno ✓'}},350)}
document.addEventListener('input',autoSave);document.addEventListener('change',autoSave);
document.documentElement.classList.toggle('dark',state.settings.theme==='dark');
setupPWA();render();importSharedFromHash();
window.addEventListener('hashchange',importSharedFromHash);
</script>
